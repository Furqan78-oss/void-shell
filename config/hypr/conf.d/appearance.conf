general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = $active_border
    col.inactive_border = $inactive_border
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 14
    active_opacity = 0.94
    inactive_opacity = 0.86

    shadow {
        enabled = true
        range = 18
        render_power = 3
        color = rgba(00000066)
    }

    blur {
        enabled = true
        size = 7
        passes = 3
        new_optimizations = true
        xray = false
        vibrancy = 0.22
        vibrancy_darkness = 0.2
    }
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
}
